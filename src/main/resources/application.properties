spring.application.name=arka-api-gateway

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webflux.routes[0].id=hellow-world-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://hellow-world-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/hello/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[1].id=arka-eureka-server
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/eureka/**

spring.cloud.gateway.server.webflux.routes[2].id=arka-cotizador
spring.cloud.gateway.server.webflux.routes[2].uri=lb://arka-cotizador
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/cotizador/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=2

spring.cloud.gateway.server.webflux.routes[3].id=arka
spring.cloud.gateway.server.webflux.routes[3].uri=lb://arka
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/arka/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=StripPrefix=2

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

server.port=8080
